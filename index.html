const ORG_SECTEURS = ["Transport et logistique","Ingénierie et conseil","Industrie","Numérique et logiciels","Commerce et distribution","Banque, assurance, finance","Santé et action sociale","BTP et immobilier","Énergie et environnement","Services aux entreprises","Secteur public","Association","Autre"];
const ORG_EFFECTIFS = ["1 à 9 salariés","10 à 49 salariés","50 à 249 salariés","250 à 999 salariés","1 000 salariés et plus"];
const sirenDigits = v => String(v||"").replace(/\D/g,"");
function sirenOk(v){
  const d = sirenDigits(v); if (d.length!==9) return false;
  if (d==="356000000") return true;
  let s=0; for (let i=0;i<9;i++){ let n=+d[i]; if (i%2===1){ n*=2; if (n>9) n-=9; } s+=n; }
  return s%10===0;
}
const sirenFmt = v => { const d=sirenDigits(v); return d.length===9 ? d.replace(/(\d{3})(\d{3})(\d{3})/,"$1 $2 $3") : String(v||""); };
const mailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim());
const orgDirs = o => String(o.services||"").split(",").map(x=>x.trim()).filter(Boolean);
const orgLogoOk = v => typeof v==="string" && /^data:image\/(png|jpeg|webp|gif|svg\+xml);base64,/.test(v);
function orgChecks(o){
  return [
    {k:"raisonSociale", t:"Raison sociale", ok:!!(o.raisonSociale||"").trim()},
    {k:"siren", t:"SIREN valide", ok:sirenOk(o.siren)},
    {k:"adresse", t:"Adresse du siège", ok:!!(o.adresse||"").trim()},
    {k:"responsableNom", t:"Représentant légal", ok:!!(o.responsableNom||"").trim()},
    {k:"secteur", t:"Secteur d'activité", ok:!!o.secteur},
    {k:"effectif", t:"Effectif", ok:!!o.effectif},
    {k:"services", t:"Directions", ok:orgDirs(o).length>0},
    {k:"dpoNom", t:"DPO", ok:!!(o.dpoNom||"").trim()},
    {k:"dpoEmail", t:"E-mail du DPO", ok:mailOk(o.dpoEmail)}
  ];
}
const orgProgress = o => { const c=orgChecks(o); return {done:c.filter(x=>x.ok).length, total:c.length, checks:c}; };
const orgInitials = n => { const w=String(n||"").replace(/[^\p{L}\p{N}\s-]/gu," ").split(/[\s-]+/).filter(x=>x && !/^(de|du|des|la|le|les|et|sa|sas|sarl|sasu|eurl)$/i.test(x)); return (w.length>1 ? w[0][0]+w[1][0] : (w[0]||"?").slice(0,2)).toUpperCase(); };

async function orgLogo(file){
  if (!file || !S.orgDraft) return;
  if (!/^image\//.test(file.type)){ toast("Choisissez une image (PNG, JPG, SVG)."); return; }
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const max=240, w=img.naturalWidth||max, h=img.naturalHeight||max, k=Math.min(1, max/Math.max(w,h));
    const cv=document.createElement("canvas"); cv.width=Math.max(1,Math.round(w*k)); cv.height=Math.max(1,Math.round(h*k));
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
    let data=cv.toDataURL("image/png"); if (data.length>120000) data=cv.toDataURL("image/webp",.85);
    if (data.length>160000){ toast("Ce logo est trop lourd, essayez une image plus simple."); return; }
    S.orgDraft.logo=data; S.orgDirty=true; render(); toast("Logo ajouté. Pensez à enregistrer.");
  }catch{ toast("Impossible de lire cette image."); }
}

async function pdfRun(filename, build){
  if (!S.dl) return toast("Téléchargement indisponible dans cette vue. Ouvrez l'application dans claude.ai.");
  toast("Préparation du PDF…");
  let blob;
  try { const J = await loadJsPDF(); blob = build(J).blob(); }
  catch(e){ console.error(e); return toast("Le PDF n'a pas pu être créé. Vérifiez votre connexion et réessayez."); }
  await save(filename, blob);
}

function nextRef(mod){
  const y = new Date().getFullYear(); const p = MODS[mod].prefix;
  const n = Math.max(0,...items(mod).map(t=>{ const m=String(t.ref||"").match(new RegExp("^"+p+"-"+y+"-(\\d+)$")); return m?+m[1]:0; }));
  return `${p}-${y}-${String(n+1).padStart(3,"0")}`;
}
async function persist(mod, id, data, action){
  const now = new Date().toISOString();
  const prev = S.data[mod].get(id);
  const hist = [...arr(prev?.history), {at:now, by:S.uid||null, action}].slice(-40);
  const {_id, ...body} = data;
  const doc = {...body, dateMaj:now, dateCreation: body.dateCreation || now, history:hist};
  await S.db.collection(mod).doc(id).set(doc);
  S.data[mod].set(id, {...doc, _id:id});
}
async function saveDraft(){
  const d = S.draft; const mod = S.mod;
  const reqFields = mod==="traitements" ? [{k:"nom",l:"Nom du traitement"}] : MODS[mod].sections.flatMap(s=>s.fields).filter(f=>f.req);
  const miss = reqFields.find(f=>!filled(d[f.k]));
  if (miss){ toast("Champ obligatoire : "+miss.l); document.querySelector(`[data-field="${miss.k}"]`)?.focus(); return; }
  S.busy = true;
  try{
    const isNew = !d._id;
    const id = d._id || S.db.collection(mod).doc().id;
    if (isNew && !d.ref) d.ref = nextRef(mod);
    await persist(mod, id, d, isNew ? "Création" : "Modification");
    S.draft = null; S.dirty=false; S.selId = id; S.view = "detail"; S.confirmDel=false;
    if (S.pending){ const p=S.pending; S.pending=null; S.busy=false; p(); return; }
    toast(isNew ? "Fiche créée" : "Modifications enregistrées");
  } catch(e){ writeError(e); }
  S.busy = false; render(); window.scrollTo(0,0);
}
function writeError(e){
  if (e?.code==="invalid_argument"){ S.canWrite=false; toast("Vous n'avez pas les droits pour modifier ce registre."); }
  else if (e?.code==="quota_exceeded") toast("Capacité de stockage atteinte : supprimez des fiches anciennes.");
  else toast("L'enregistrement a échoué. Vérifiez votre connexion et réessayez.");
}

  if (LS.needsPerm) return `<div class="notice warn">${I.alert}<div style="flex:1"><b>Votre fichier de données « ${esc(LS.fileName)} » doit être reconnecté.</b> Par sécurité, le navigateur demande votre accord à chaque ouverture.<div class="actions" style="margin-top:8px"><button class="btn sm primary" data-action="local-reconnect">Reconnecter le fichier</button></div></div></div>`;
  if (LS.error) return `<div class="notice warn">${I.alert}<div>${esc(LS.error)}</div></div>`;
  if (!LS.file) return `<div class="notice">${I.info}<div style="flex:1"><b>Vos données sont enregistrées uniquement dans ce navigateur.</b> ${LS.supported?"Choisissez un fichier de données, de préférence dans un dossier OneDrive ou SharePoint, pour les sécuriser et les transmettre.":"Exportez régulièrement une sauvegarde depuis la page Sauvegarde."}<div class="actions" style="margin-top:8px"><button class="btn sm" data-action="nav" data-view="backup">Configurer la sauvegarde</button></div></div></div>`;
  return "";
}

/* ================= Accueil animé et journal ================= */
const WEL = {open:false, ready:false, since:null, first:false, mode:"open", saved:false};
try { WEL.open = localStorage.getItem("egide-skip")!=="1"; } catch { WEL.open = true; }
const prefsPath = () => S.uid ? `data/users/${S.uid}/prefs` : null;
async function savePrefs(patch){
  S.prefs = {...(S.prefs||{}), ...patch};
  try { localStorage.setItem("egide-prefs", JSON.stringify(S.prefs)); localStorage.setItem("egide-skip", S.prefs.skipWelcome?"1":"0"); } catch {}
  if (S.db && prefsPath()) { try { await S.db.doc(prefsPath()).set(S.prefs); } catch {} }
}
function ago(iso){
  const m = Math.round((Date.now()-new Date(iso))/6e4);
  if (m<1) return "à l'instant"; if (m<60) return `il y a ${m} min`;
  const h = Math.round(m/60); if (h<24) return `il y a ${h} h`;
  const d = Math.round(h/24); if (d<7) return `il y a ${d} jour${d>1?"s":""}`;
  return "le "+fmtD(iso.slice(0,10));
}
const ART = {traitements:"le traitement", aipd:"l'AIPD", soustraitants:"le sous-traitant", demandes:"la demande", violations:"la violation", actions:"l'action", formations:"la session", conservation:"l'échéance"};
const VERB = a => /Création/.test(a)?["créé","création"]:/Import/.test(a)?["importé","import"]:/Revue/.test(a)?["revu","revue"]:/Archiv/.test(a)?["archivé","modification"]:/Restaur/.test(a)?["restauré","import"]:/Réactiv/.test(a)?["réactivé","modification"]:["modifié","modification"];
function journalEvents(since){
  const ev = [];
  MOD_KEYS.forEach(m=>items(m).forEach(t=>arr(t.history).forEach(h=>{ if (h.at && h.at>since) ev.push({at:h.at, by:h.by||"", action:h.action||"", mod:m, id:t._id, name:titleOf(m,t)}); })));
  ev.sort((a,b)=>b.at.localeCompare(a.at));
  const seen = new Map(), out = [];
  ev.forEach(e=>{ const k=[e.mod,e.id,VERB(e.action)[0],e.by].join("|"); if (seen.has(k)){ seen.get(k).n++; return; } const x={...e,n:1}; seen.set(k,x); out.push(x); });
  return out;
}
const LOGO_ANIM = `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="wgEgide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0088CE"/><stop offset="1" stop-color="#003865"/></linearGradient></defs><path class="w-sh" d="M20 3 6 8.5v10.2C6 27.6 12 34.4 20 37c8-2.6 14-9.4 14-18.3V8.5z" fill="url(#wgEgide)" stroke="#0088CE" stroke-width="1.2" stroke-linejoin="round"/><path class="w-ck" d="m13.5 20.5 4.5 4.5 8.5-9.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle class="w-dot" cx="31" cy="8" r="4.5" fill="#BA6AA7" style="stroke:var(--bg)" stroke-width="2"/></svg>`;
function welcomeBody(){
  if (!WEL.ready) return `<div class="jcard rise" style="--d:.9s"><p class="muted wait">Préparation de votre journal<span>.</span><span>.</span><span>.</span></p></div>`;
  if (WEL.first && WEL.mode==="open") {
    const f = [["list","m-trt","Votre registre","Décrivez vos traitements, à partir de modèles ou d'un fichier Excel."],["alert","m-vio","Vos priorités","Égide repère les délais légaux et les points à corriger."],["learn","m-for","Vos équipes","Présentez la formation intégrée et gardez la trace des sessions."]];
    return `<div class="wfeat">${f.map(([ic,c,t,s],i)=>`<div class="wf ${c} rise" style="--d:${(1+i*.12).toFixed(2)}s"><span class="ic">${I[ic]}</span><b>${t}</b><span>${s}</span></div>`).join("")}</div>`;
  }
  const since = WEL.since || new Date(Date.now()-7*864e5).toISOString();
  const ev = journalEvents(since);
  const sinceDay = since.slice(0,10);
  const dues = []; MOD_KEYS.forEach(m=>items(m).forEach(t=>(MODS[m].dates?.(t)||[]).forEach(x=>{ if (x.d>sinceDay && x.d<=today()) dues.push({...x, mod:m, id:t._id, name:titleOf(m,t)}); })));
  const urg = allAlerts().filter(a=>a.sev==="crit").length;
  const cnt = k => ev.filter(e=>VERB(e.action)[1]===k).length;
  const sum = [[cnt("création"),"création","créations"],[cnt("modification"),"modification","modifications"],[cnt("import"),"import","imports"],[cnt("revue"),"revue","revues"],[dues.length,"échéance atteinte","échéances atteintes"]].filter(x=>x[0]);
  const who = e => e.by && e.by===S.uid ? `<b>Vous</b> avez` : e.by ? `<b data-wuid="${esc(e.by)}">Un collègue</b> a` : `<b>Égide</b> a`;
  const items_ = [
    ...dues.map(x=>({at:x.d+"T23:59", html:`<li class="${MODS[x.mod].cls} due-j"><span><b>Échéance atteinte :</b> ${esc(x.l)} · ${esc(x.name)}</span><span class="ago">${fmtD(x.d)}</span></li>`})),
    ...ev.map(e=>({at:e.at, html:`<li class="${MODS[e.mod].cls}"><button data-action="w-open" data-mod="${e.mod}" data-id="${esc(e.id)}">${who(e)} ${VERB(e.action)[0]} ${ART[e.mod]} <b>${esc(e.name)}</b>${e.n>1?` <span class="muted">(${e.n} fois)</span>`:""}</button><span class="ago">${ago(e.at)}</span></li>`}))
  ].sort((a,b)=>b.at.localeCompare(a.at));
  const shown = items_.slice(0,7);
  return `<div class="jcard rise" style="--d:.9s">
    <div class="jhead"><h2>${WEL.mode==="journal"&&!WEL.since?"Les 7 derniers jours":"Depuis votre dernière visite"}</h2>${sum.length?`<div class="jsum">${sum.map(([n,a,b])=>`<span>${n} ${n>1?b:a}</span>`).join("")}</div>`:""}</div>
    ${shown.length ? `<ul class="jlist">${shown.map((x,i)=>x.html.replace("<li ",`<li style="--d:${(1.05+i*.07).toFixed(2)}s" `)).join("")}</ul>${items_.length>7?`<p class="muted" style="font-size:.82rem">et ${items_.length-7} autre(s) événement(s).</p>`:""}`
      : `<p class="calm">Rien n'a changé depuis votre dernière visite. Tout est calme.</p>`}
    ${S.newsLoaded && newsItems().some(isNewNews) ? `<button class="jnews" data-action="w-news">${I.news}<span><b>${newsItems().filter(isNewNews).length} nouvelle${newsItems().filter(isNewNews).length>1?"s":""} actualité${newsItems().filter(isNewNews).length>1?"s":""}</b> sur la protection des données</span>${I.next}</button>` : ""}
    <div class="jnow ${urg?"bad":"good"}">${urg?`${I.alert}<span><b>${urg} point${urg>1?"s":""} urgent${urg>1?"s":""}</b> ${urg>1?"vous attendent":"vous attend"} sur l'accueil.</span>`:`${I.check}<span>Aucun point urgent en ce moment.</span>`}</div>
  </div>`;
}
function confettiHTML(){
  const cols = ["#0088CE","#97C7EC","#800064","#BA6AA7","#003865","#F0A843"];
  const shapes = ["","r","l"];
  let h = "";
  for (let i=0;i<18;i++){
    const a = (i/18)*Math.PI*2 + (i%3)*.21, dist = 70 + (i*37)%60;
    const x = Math.round(Math.cos(a)*dist), y = Math.round(Math.sin(a)*dist*.8 - 18 + (i%4)*6);
    h += `<i class="${shapes[i%3]}" style="--cc:${cols[i%cols.length]};--x:${x}px;--y:${y+40}px;--r:${(i*67)%360-180}deg;--dl:${(1.0+(i%5)*.03).toFixed(2)}s"></i>`;
  }
  return `<span class="confetti" aria-hidden="true">${h}</span>`;
}
function renderWelcome(){
  const el = $("#welcome");
  if (!WEL.open){ el.hidden = true; el.innerHTML = ""; if (!P.open) document.body.style.overflow = ""; return; }
  el.hidden = false; el.classList.remove("out"); document.body.style.overflow = "hidden";
  const last = WEL.since ? new Date(WEL.since).toLocaleString("fr-FR",{weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"}) : "";
  const sub = WEL.mode==="journal" ? "Activité enregistrée" + (last?` depuis votre précédente ouverture, le ${last}`:"") : WEL.first ? "Bienvenue dans Égide, votre espace de conformité RGPD." : `Ravi de vous revoir. Dernière visite : ${last}.`;
  el.innerHTML = `<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="wbox">
      <div class="wlogo">${LOGO_ANIM}${WEL.burst?"":confettiHTML()}</div>
      <div class="rise" style="--d:.45s"><div class="eyebrow" style="justify-content:center">${new Date().toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long", year:"numeric"})}</div><h1 class="wtitle">${greeting()} <span class="wave2" aria-hidden="true" style="display:inline-block;font-size:1em;color:inherit;margin:0;letter-spacing:0">👋</span>${S.org.raisonSociale?`<span>${esc(S.org.raisonSociale)}</span>`:""}</h1><p class="wsub">${esc(sub)}</p></div>
      ${welcomeBody()}
      <div class="rise wact" style="--d:1.25s">
        <button class="btn primary wgo" data-action="w-continue" id="w-go">${WEL.first&&WEL.mode==="open"?"Découvrir mon espace":"Continuer"}${I.next}</button>
        <label class="switch wskip"><input type="checkbox" id="w-skip" ${S.prefs?.skipWelcome?"":"checked"}>Afficher cet accueil à chaque ouverture</label>
      </div>
    </div>`;
  setTimeout(()=>{ try{ $("#w-go")?.focus({preventScroll:true}); }catch{} }, 50);
  const ids = [...el.querySelectorAll("[data-wuid]")].map(x=>x.dataset.wuid);
  if (ids.length && S.user) S.user.profiles([...new Set(ids)]).then(ps=>el.querySelectorAll("[data-wuid]").forEach(x=>{ x.textContent = ps[x.dataset.wuid]?.name || "Un collègue"; })).catch(()=>{});
}
function closeWelcome(){
  const el = $("#welcome");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const done = () => { WEL.open = false; renderWelcome(); render(); };
  if (reduce) return done();
  el.classList.add("out"); setTimeout(done, 380);
}
function welcomeReady(){
  if (WEL.ready || !allLoaded()) return;
  WEL.ready = true;
  if (!WEL.saved){ WEL.saved = true; savePrefs({lastVisit:new Date().toISOString()}); }
  if (WEL.open) renderWelcome();
}

/* ================= Démarrage ================= */
try { S.prefs = JSON.parse(localStorage.getItem("egide-prefs")||"{}"); } catch { S.prefs = {}; }
{ const av=$("#appver"); if (av) av.textContent = "version "+EGIDE_VERSION; }
if (TRAIN){ WEL.open = false; document.title = "Formation RGPD · Égide"; }
render(); renderWelcome();
(async () => { if (TRAIN) return;
  const [db, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  S.db = db; S.user = user; S.dl = dl;
  if (!db){ S.dbOk=false; MOD_KEYS.forEach(k=>S.loaded[k]=true); setSync("off"); WEL.since = S.prefs.lastVisit||null; WEL.first = !WEL.since; WEL.saved = true; render(); welcomeReady(); return; }
  S.dbOk = true; setSync("on");
  if (LOCAL){ LS.onChange = () => { setSync("on"); if (document.activeElement?.closest?.(".secp")) return; if (["backup","dashboard"].includes(S.view)) render(); }; await LS.init; setSync("on"); }
  if (user){ S.uid = await user.id(); const c = await user.can("data.write"); if (c===false) S.canWrite=false; try{ S.meName = (await user.me()).name || ""; }catch{} }
  if (prefsPath()){ try { const ps = await db.doc(prefsPath()).get(); if (ps.exists){ const lv=[S.prefs.lastVisit, ps.data().lastVisit].filter(Boolean).sort().pop(); S.prefs = {...S.prefs, ...ps.data(), ...(lv?{lastVisit:lv}:{})}; } } catch {} }
  WEL.since = S.prefs.lastVisit || null; WEL.first = !WEL.since;
  if (S.prefs.skipWelcome && WEL.mode==="open" && WEL.open){ WEL.open = false; }
  renderWelcome();
  const quiet = () => S.view==="edit" || S.view==="finaliser" || (S.view==="revue" && S.refDirty) || S.view==="org" || S.view==="import" || (S.view==="jeu" && G.mode && !G.done) || (S.view==="backup" && (S.importData || S.recKey || document.activeElement?.closest?.(".secp")));
  const refresh = mod => { if (quiet()) { renderNav(); return; } if (S.view==="list" && S.mod===mod){ renderNav(); renderRows(); } else if (S.view==="list") renderNav(); else render(); };
  MOD_KEYS.forEach(mod => {
    db.collection(mod).onSnapshot(snap => {
      S.data[mod] = new Map(snap.docs.map(d => [d.id, {...d.data(), _id:d.id}]));
      S.loaded[mod] = true; refresh(mod); welcomeReady(); arAutoCheck();
    }, () => { S.loaded[mod] = true; setSync("off"); refresh(mod); welcomeReady(); });
  });
  db.collection("scores").onSnapshot(snap => { S.scores = new Map(snap.docs.map(d=>[d.id,{...d.data()}])); if (S.view==="jeu" && !G.mode && !WEL.open) render(); }, () => {});
  claude.use("sample").then(sm=>{ S.sample=sm; if (S.view==="news" && !quiet()) render(); }).catch(()=>{});
  db.doc("config/veille").onSnapshot(snap => { if (snap.exists){ const d=snap.data(); if (!d || !d.genereLe || !Array.isArray(d.actions)) return; if (!S.np) S.np={}; if (!S.np.plan || (d.genereLe||"")>=(S.np.plan.genereLe||"")) { S.np.plan = {...d, actions:arr(d.actions)}; if (S.view==="news" && !quiet() && !S.np.busy) render(); } } }, () => {});
  claude.use("assets").then(a=>{ S.assets=a; if (!quiet() && ["detail","pieces"].includes(S.view)) render(); }).catch(()=>{});
  db.collection("resultats").onSnapshot(snap => { S.results = new Map(snap.docs.map(d=>[d.id,{...d.data(),_id:d.id}])); if (S.view==="list" && S.mod==="formations" && !quiet() && !(document.activeElement?.matches?.("input,textarea,select") && document.activeElement.closest(".trn-adm,.trn-res"))) render(); }, () => {});
  db.doc("config/formationDistance").onSnapshot(snap => { if (snap.exists) S.trainCfg = snap.data(); }, () => {});
  db.collection("campagnes").onSnapshot(snap => { S.camps = new Map(snap.docs.map(d=>[d.id,{...d.data(),_id:d.id}])); if (quiet()) renderNav(); else if (["revue","dashboard","detail"].includes(S.view)) render(); else renderNav(); }, () => {});
  db.collection("rapports").onSnapshot(snap => { S.rapports = new Map(snap.docs.map(d=>[d.id,{...d.data(),_id:d.id}])); S.rapportsLoaded = true; arAutoCheck(); if (!quiet() && ["rapport","dashboard"].includes(S.view)) render(); }, () => { S.rapportsLoaded = true; });
  db.collection("pieces").onSnapshot(snap => { S.pieces = new Map(snap.docs.map(d=>[d.id,{...d.data(),_id:d.id}])); S.piecesLoaded = true; if (quiet() || S.pjBusy || S.pjEdit || S.consDone) renderNav(); else if (["detail","pieces"].includes(S.view) || (S.view==="list" && S.mod==="soustraitants")) render(); else renderNav(); }, () => { S.piecesLoaded = true; });
  db.collection("actualites").onSnapshot(snap => { S.news = new Map(snap.docs.map(d=>[d.id,{...d.data(),_id:d.id}])); S.newsLoaded = true; if (S.view==="news") render(); else renderNav(); }, () => { S.newsLoaded = true; });
  db.doc("config/org").onSnapshot(snap => { S.org = snap.exists ? {...snap.data()} : {}; if (quiet() || S.view==="list") renderNav(); else render(); }, () => {});
})();
</script>
