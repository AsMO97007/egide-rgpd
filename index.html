<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Égide RGPD</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003865">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : rail de navigation clair + espace de travail lumineux ; accueil en dégradé doux bleu/prune ; chaque module a sa couleur de la charte. Sur mobile, le rail devient une barre supérieure. */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#F7F9FB; --sunk:#ECF0F4;
  --m-for:#2E7DB8; --m-for-soft:#E6F1FA;
  --ink:#3C3732; --heading:#003865; --muted:#7A736C; --line:#E1E1E1; --line-2:#D2D5DA;
  --primary:#0088CE; --primary-ink:#FFFFFF; --primary-soft:#E2F1FA; --sky:#97C7EC;
  --plum:#800064; --mauve:#BA6AA7;
  --rail:#FFFFFF; --rail-ink:#003865; --rail-muted:#7D8DA1; --rail-hover:#F0F6FB; --rail-active:#E2F1FA; --rail-line:#E4E8EE;
  --hero-a:#DDEFFB; --hero-b:#F6E7F2; --hero-ink:#003865; --hero-muted:#4C5F75; --gauge-track:rgba(0,56,101,.1);
  --ok:#1F8A52; --ok-soft:#E1F3E9; --warn:#B86A06; --warn-soft:#FCEFD9; --crit:#C8243D; --crit-soft:#FBE4E8;
  --m-trt:#0088CE; --m-trt-soft:#E2F1FA;
  --m-aipd:#800064; --m-aipd-soft:#F6E5F1;
  --m-st:#003865; --m-st-soft:#E1EAF3;
  --m-ddr:#BA6AA7; --m-ddr-soft:#F7EAF4;
  --m-vio:#C8243D; --m-vio-soft:#FBE4E8;
  --m-act:#3C3732; --m-act-soft:#EEECEA;
  --m-cons:#1A8A80; --m-cons-soft:#DFF3F1;
  --shadow:0 1px 2px rgba(0,56,101,.06),0 6px 20px rgba(0,56,101,.06);
  --f-display:"Sora","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06152A; --surface:#0C2039; --surface-2:#0F2643; --sunk:#0A1B32;
  --ink:#ECE8E3; --heading:#DCEBF8; --muted:#9AA9BD; --line:#1C3556; --line-2:#28456B;
  --primary:#3CA9E4; --primary-ink:#00243D; --primary-soft:#0E3556; --sky:#97C7EC;
  --plum:#D07AB8; --mauve:#D9A0CC;
  --rail:#0A1C33; --rail-ink:#DCEBF8; --rail-muted:#8FA6BF; --rail-hover:rgba(151,199,236,.08); --rail-active:#0E3556; --rail-line:#1C3556;
  --hero-a:#0E3556; --hero-b:#33163A; --hero-ink:#FFFFFF; --hero-muted:#B9D3EA; --gauge-track:rgba(255,255,255,.14);
  --m-for:#6DB4E8; --m-for-soft:#10304D; --blob-op:.22;
  --ok:#4CC487; --ok-soft:#10331F; --warn:#F0A843; --warn-soft:#3A2A10; --crit:#F2667C; --crit-soft:#3E1620;
  --m-trt:#3CA9E4; --m-trt-soft:#0E3556; --m-aipd:#D07AB8; --m-aipd-soft:#3A1430;
  --m-st:#97C7EC; --m-st-soft:#13314F; --m-ddr:#D9A0CC; --m-ddr-soft:#35203A;
  --m-vio:#F2667C; --m-vio-soft:#3E1620; --m-act:#D4CDC5; --m-act-soft:#2A2622; --m-cons:#5FCBBF; --m-cons-soft:#0E3533;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06152A; --surface:#0C2039; --surface-2:#0F2643; --sunk:#0A1B32;
  --ink:#ECE8E3; --heading:#DCEBF8; --muted:#9AA9BD; --line:#1C3556; --line-2:#28456B;
  --primary:#3CA9E4; --primary-ink:#00243D; --primary-soft:#0E3556; --sky:#97C7EC;
  --plum:#D07AB8; --mauve:#D9A0CC;
  --rail:#0A1C33; --rail-ink:#DCEBF8; --rail-muted:#8FA6BF; --rail-hover:rgba(151,199,236,.08); --rail-active:#0E3556; --rail-line:#1C3556;
  --hero-a:#0E3556; --hero-b:#33163A; --hero-ink:#FFFFFF; --hero-muted:#B9D3EA; --gauge-track:rgba(255,255,255,.14);
  --m-for:#6DB4E8; --m-for-soft:#10304D; --blob-op:.22;
  --ok:#4CC487; --ok-soft:#10331F; --warn:#F0A843; --warn-soft:#3A2A10; --crit:#F2667C; --crit-soft:#3E1620;
  --m-trt:#3CA9E4; --m-trt-soft:#0E3556; --m-aipd:#D07AB8; --m-aipd-soft:#3A1430;
  --m-st:#97C7EC; --m-st-soft:#13314F; --m-ddr:#D9A0CC; --m-ddr-soft:#35203A;
  --m-vio:#F2667C; --m-vio-soft:#3E1620; --m-act:#D4CDC5; --m-act-soft:#2A2622; --m-cons:#5FCBBF; --m-cons-soft:#0E3533;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0;color:var(--heading)}
h1{font-size:1.7rem;letter-spacing:-.015em;font-weight:700}
h2{font-size:1.06rem}
h3{font-size:.95rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.8em;letter-spacing:.02em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.m-trt{--c:var(--m-trt);--cs:var(--m-trt-soft)} .m-aipd{--c:var(--m-aipd);--cs:var(--m-aipd-soft)} .m-st{--c:var(--m-st);--cs:var(--m-st-soft)}
.m-ddr{--c:var(--m-ddr);--cs:var(--m-ddr-soft)} .m-vio{--c:var(--m-vio);--cs:var(--m-vio-soft)} .m-act{--c:var(--m-act);--cs:var(--m-act-soft)}
.m-gen{--c:var(--primary);--cs:var(--primary-soft)} .m-cons{--c:var(--m-cons);--cs:var(--m-cons-soft)} .m-for{--c:var(--m-for);--cs:var(--m-for-soft)}

/* ---------- Rail ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);border-right:1px solid var(--rail-line);display:flex;flex-direction:column;gap:20px;padding:22px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 4px}
.logo{flex:none;display:block}
.logo svg{width:40px;height:40px;display:block}
.brand b{font-family:var(--f-display);font-size:1.3rem;display:block;line-height:1.05;font-weight:700;color:var(--heading);letter-spacing:-.01em}
.brand small{color:var(--rail-muted);font-size:.74rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;color:var(--rail-muted);padding:14px 12px 6px;font-weight:700}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:11px;color:var(--rail-ink);font-weight:500;font-size:.92rem;position:relative}
.nav button:hover{background:var(--rail-hover)}
.nav button[aria-current="page"]{background:var(--rail-active);font-weight:700}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--primary)}
.nav button:focus-visible{outline:2px solid var(--primary)}
.nav .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--navc,#0088CE) 72%,#fff) 0%,var(--navc,#0088CE) 55%,color-mix(in srgb,var(--navc,#0088CE) 82%,#000) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 8px color-mix(in srgb,var(--navc,#0088CE) 32%,transparent);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.nav .ic svg{width:18px;height:18px}
.nav button:hover .ic{transform:translateY(-1px) rotate(-6deg) scale(1.05)}
.nav button[aria-current="page"] .ic{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 3px color-mix(in srgb,var(--navc,#0088CE) 22%,transparent),0 3px 8px color-mix(in srgb,var(--navc,#0088CE) 32%,transparent)}
.nav .count{margin-left:auto;font-size:.72rem;background:var(--crit);color:#fff;border-radius:99px;padding:1px 7px;font-weight:700}
.rail-foot{margin-top:auto;font-size:.76rem;color:var(--rail-muted);padding:12px 8px 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rail-line)}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rail-muted);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.dot.off{background:var(--warn)}

main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--c,var(--muted));font-weight:700;margin-bottom:6px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--primary))}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--primary-ink)}
.btn.mod{background:var(--c);border-color:var(--c);color:#fff}
.btn.mod:hover{filter:brightness(1.1);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{border-color:var(--crit)}
.btn.danger.solid{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:.8rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

/* ---------- Panneaux ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.panel-h h2{display:flex;align-items:center;gap:10px}
.panel-b{padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px}

/* ---------- Accueil ---------- */
.hero{background:linear-gradient(115deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:20px;padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;position:relative;overflow:hidden;border:1px solid var(--line)}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-90px;top:-150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--primary) 22%,transparent),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;width:260px;height:260px;left:38%;bottom:-170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--plum) 16%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero h1{color:var(--hero-ink);font-size:1.9rem}
.hero .eyebrow{color:var(--hero-muted)}
.hero p{color:var(--hero-muted);max-width:62ch;margin-top:8px;font-size:.98rem}
.hero .actions{margin-top:18px}
.hero .btn:not(.primary){background:rgba(255,255,255,.7);border-color:transparent;color:var(--heading)}
:root[data-theme="dark"] .hero .btn:not(.primary){background:rgba(255,255,255,.08);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .btn:not(.primary){background:rgba(255,255,255,.08);color:#fff}}
.gauge{display:flex;align-items:center;gap:16px;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:16px;padding:14px 18px}
.gauge svg{width:112px;height:112px;flex:none}
.gauge .lbl{font-size:.8rem;color:var(--hero-muted);max-width:140px}
.gauge .lbl b{display:block;color:var(--heading);font-family:var(--f-display);font-size:1rem}
.wave{display:inline-block;transform-origin:70% 80%}
@media (prefers-reduced-motion:no-preference){.wave{animation:wave 1.6s ease-in-out 1}@keyframes wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(14deg)}40%,80%{transform:rotate(-6deg)}}}
.onb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:16px 20px}
.onb button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);font-size:.84rem;font-weight:600;color:var(--heading)}
.onb button:hover{border-color:var(--primary);background:var(--primary-soft)}
.onb button.done{border-style:solid;border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.onb .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:.7rem;background:var(--surface)}
.onb .done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.onb small{display:block;font-weight:400;color:var(--muted);font-size:.76rem;margin-top:2px}
.onb .done small{color:inherit;opacity:.8}

/* ---------- Tuiles modules ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tiles .tile:first-child{grid-column:span 2}
.tile{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c)}
.tile:hover{border-color:var(--c);transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.tile .ic{grid-row:1/3;width:42px;height:42px;border-radius:11px;background:var(--cs);color:var(--c);display:grid;place-items:center}
.tile .ic svg{width:20px;height:20px}
.tile .tt{font-size:.84rem;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:1.75rem;font-weight:700;color:var(--heading);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{grid-column:1/-1;font-size:.82rem;color:var(--muted);margin-top:6px}
.tile .s b{color:var(--crit);font-weight:600}
.tile .s b.w{color:var(--warn)}
.tile .s b.o{color:var(--ok)}

/* ---------- Alertes & échéances ---------- */
.alerts{list-style:none;margin:0;padding:0}
.alerts li{border-bottom:1px solid var(--line)}
.alerts li:last-child{border-bottom:0}
.alerts button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 20px;width:100%;box-sizing:border-box}
.alerts button:hover{background:var(--surface-2)}
.alerts button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.sev{width:4px;align-self:stretch;border-radius:4px;min-height:34px}
.sev.crit{background:var(--crit)}.sev.warn{background:var(--warn)}.sev.info{background:var(--line-2)}
.alerts .t{font-weight:600;font-size:.9rem}
.alerts .s{font-size:.8rem;color:var(--muted)}
.mtag{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;color:var(--c);background:var(--cs);padding:1px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px;vertical-align:1px}
.due{display:flex;flex-direction:column}
.due button{all:unset;cursor:pointer;display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);box-sizing:border-box;width:100%}
.due button:last-child{border-bottom:0}
.due button:hover{background:var(--surface-2)}
.due .d{text-align:center;border-radius:9px;background:var(--cs);color:var(--c);padding:4px 0;font-variant-numeric:tabular-nums;line-height:1.15}
.due .d b{display:block;font-family:var(--f-display);font-size:1.05rem}
.due .d small{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.due .late .d{background:var(--crit-soft);color:var(--crit)}
.due .x{font-size:.88rem;font-weight:600;min-width:0}
.due .x small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.empty{padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .big{width:54px;height:54px;border-radius:16px;background:var(--cs,var(--primary-soft));color:var(--c,var(--primary));display:grid;place-items:center}
.empty .big svg{width:26px;height:26px}

.bars{display:flex;flex-direction:column;gap:12px}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) 2.2rem;gap:4px 10px;font-size:.85rem}
.bars .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:9px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--primary);border-radius:9px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--heading)}
.stackbar{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--sunk)}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--lc);box-shadow:inset 0 0 0 2px var(--lb,transparent)}

/* ---------- Pastilles ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-crit{background:var(--crit-soft);color:var(--crit)}
.t-info{background:var(--primary-soft);color:var(--primary)} .t-neutral{background:var(--sunk);color:var(--muted)} .t-plum{background:var(--m-aipd-soft);color:var(--m-aipd)}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.ex{background:var(--m-ddr-soft);color:var(--m-ddr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.chip.sens{background:var(--crit-soft);color:var(--crit);border-color:transparent}
button.chip{cursor:pointer;color:var(--c,var(--primary));background:var(--cs,var(--primary-soft));border-color:transparent;font:inherit;font-size:.8rem;font-weight:600}
button.chip:hover{text-decoration:underline}

/* ---------- Listes ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input,.search input[type=search]{width:100%;padding:10px 12px 10px 40px}
.search svg{pointer-events:none;z-index:1}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=datetime-local],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
textarea{min-height:88px;resize:vertical;line-height:1.45}
select{cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);outline:none}
.toolbar select{width:auto;flex:0 1 auto}
.switch{display:flex;gap:10px;align-items:center;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--heading)}
.switch input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.list{display:flex;flex-direction:column}
.row-i{all:unset;cursor:pointer;display:grid;gap:16px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line);box-sizing:border-box;width:100%;font-size:.88rem}
.row-i:last-child{border-bottom:0}
.row-i:hover{background:var(--surface-2)}
.row-i:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.row-i .nm{font-weight:600;min-width:0;color:var(--heading);font-size:.93rem}
.row-i .nm small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i>span{min-width:0}
.list-h{display:grid;gap:16px;padding:10px 20px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
.meter{display:flex;align-items:center;gap:8px;font-size:.78rem;font-variant-numeric:tabular-nums;font-weight:600}
.meter span{flex:1;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;min-width:40px}
.meter span i{display:block;height:100%;border-radius:9px}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;margin-left:6px}
.flag.crit{color:var(--crit)}.flag.warn{color:var(--warn)}

/* ---------- Fiche ---------- */
.fiche-head{display:flex;flex-direction:column;gap:10px}
.fiche-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sect{padding:20px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px 24px;border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:0}
.sect h3 small{display:block;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-weight:500;margin-top:4px}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:10px 16px}
dl.kv dt{color:var(--muted);font-size:.85rem}
dl.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.none{color:var(--muted);font-style:italic}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:.85rem}
.timeline li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.timeline li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--primary));margin-top:7px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:var(--r-sm);background:var(--crit-soft);color:var(--crit);font-weight:600}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:var(--r-sm);background:var(--primary-soft);color:var(--ink);font-size:.9rem}
.notice.warn{background:var(--warn-soft)}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--primary)}
.notice.warn svg{color:var(--warn)}
.countdown{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 20px;border-radius:var(--r)}
.countdown .big{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.countdown.crit{background:var(--crit-soft);color:var(--crit)}
.countdown.warn{background:var(--warn-soft);color:var(--warn)}
.countdown.ok{background:var(--ok-soft);color:var(--ok)}
.countdown p{color:var(--ink);font-size:.88rem}
.linked{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--c)}
.lcard h3{font-size:.82rem;color:var(--c);display:flex;justify-content:space-between;align-items:center;gap:8px}
.lcard .chips{gap:4px}

/* ---------- Cartographie des risques ---------- */
.riskwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.riskmap{width:100%;max-width:340px;height:auto}
.rcards{display:grid;gap:12px}
.rcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rcard h3{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem}
.rcard .lvls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.ptable{width:100%;border-collapse:collapse;font-size:.88rem}
.ptable td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ptable tr:last-child td{border-bottom:0}
.ptable td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.ptable small{display:block;color:var(--muted)}

/* ---------- Éditeur ---------- */
.editor{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.steps{position:sticky;top:24px;display:flex;flex-direction:column;gap:2px}
.steps a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:.86rem;font-weight:500}
.steps a:hover{background:var(--surface)}
.steps .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:.7rem;flex:none;font-family:var(--f-mono);color:var(--muted);background:var(--surface)}
.steps .ck.done{background:var(--c,var(--primary));border-color:var(--c,var(--primary));color:var(--surface)}
.form{display:flex;flex-direction:column;gap:20px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.fs{scroll-margin-top:16px}
.fs .panel-h{border-top:3px solid var(--c,var(--primary));border-radius:var(--r) var(--r) 0 0}
.fs .panel-h h2 small{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-weight:500}
.fs .intro{font-size:.86rem;color:var(--muted);grid-column:1/-1;margin-top:-4px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:.83rem;font-weight:600;color:var(--heading)}
.f .hint{font-size:.77rem;color:var(--muted)}
.fhead{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;color:var(--heading);padding-top:14px;border-top:1px dashed var(--line-2);margin-top:4px}
.fhead.first{border-top:0;padding-top:0;margin-top:0}
.fhead .n{width:26px;height:26px;border-radius:7px;background:var(--cs,var(--primary-soft));color:var(--c,var(--primary));display:grid;place-items:center;font-size:.72rem;font-family:var(--f-mono)}
.req{color:var(--crit)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;font-size:.85rem;font-weight:500;cursor:pointer;background:var(--surface);color:var(--ink)}
.checks label:has(input:checked){border-color:var(--c,var(--primary));background:var(--cs,var(--primary-soft))}
.checks.sens label:has(input:checked){border-color:var(--crit);background:var(--crit-soft)}
.checks input{margin-top:3px;accent-color:var(--c,var(--primary))}
.linkbox{border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.linkbox input[type=search]{border:0;border-bottom:1px solid var(--line);border-radius:0}
.linkbox .opts{max-height:220px;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.linkbox label{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:7px;font-size:.86rem;font-weight:500;cursor:pointer;color:var(--ink)}
.linkbox label:hover{background:var(--surface-2)}
.linkbox label:has(input:checked){background:var(--primary-soft)}
.linkbox input{accent-color:var(--primary)}
.radios{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.radios label{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;font-size:.86rem;align-items:flex-start;color:var(--ink);font-weight:400}
.radios label:has(input:checked){border-color:var(--c,var(--primary));background:var(--cs,var(--primary-soft))}
.radios input{accent-color:var(--c,var(--primary));margin-top:4px}
.radios b{display:block;font-weight:600;color:var(--heading)}
.radios small{color:var(--muted);font-size:.78rem}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border:1px solid var(--line-2);border-radius:10px;padding:4px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:7px;cursor:pointer;font-size:.7rem;font-weight:600;color:var(--muted);text-align:center;position:relative}
.scale label b{font-family:var(--f-display);font-size:1rem;color:var(--ink)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:hover{background:var(--surface-2)}
.scale label:has(input:focus-visible){outline:2px solid var(--primary)}
.scale label.l1:has(input:checked),.scale label.l2:has(input:checked){background:var(--ok-soft);color:var(--ok)}
.scale label.l3:has(input:checked){background:var(--warn-soft);color:var(--warn)}
.scale label.l4:has(input:checked){background:var(--crit-soft);color:var(--crit)}
.scale label:has(input:checked) b{color:inherit}
.princ{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line);grid-column:1/-1}
.princ:last-child{border-bottom:0}
.princ .pl{font-weight:600;font-size:.88rem;color:var(--heading)}
.princ .pl small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.princ textarea{grid-column:1/-1;min-height:56px}
.savebar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 -4px 20px rgba(0,56,101,.08)}

.toast{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#003865;color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);z-index:50;max-width:calc(100vw - 40px);border-left:4px solid #0088CE}
.backup-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.backup-grid .panel{padding:20px;display:flex;flex-direction:column;gap:10px}
.backup-grid .panel .btn{align-self:flex-start;margin-top:auto}
ol.steps-pass{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.skel{height:14px;border-radius:6px;background:var(--sunk);margin:16px 20px}

/* ---------- Accueil épuré ---------- */
.home{max-width:860px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.welcome{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.welcome h1{font-size:2.2rem}
.welcome p{font-size:1.06rem;color:var(--muted);max-width:60ch}
.welcome p b{color:var(--heading)}
.wbar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:4px}
.score{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.score b{font-family:var(--f-display);font-size:1.15rem;color:var(--heading)}
.score .track{width:120px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.score .track i{display:block;height:100%;border-radius:9px}
.addwrap{position:relative}
.addmenu{position:absolute;top:calc(100% + 8px);left:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(0,56,101,.16);padding:6px;min-width:260px;display:flex;flex-direction:column}
.addmenu button{all:unset;cursor:pointer;display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:9px;font-size:.92rem;font-weight:500;color:var(--ink)}
.addmenu button:hover,.addmenu button:focus-visible{background:var(--surface-2)}
.addmenu .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.addmenu .ic svg{width:17px;height:17px}
.onbline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.onbline .dots{display:flex;gap:4px}
.onbline [data-action=show-onb]{display:inline-flex;align-items:center;gap:6px}.onbline [data-action=show-onb] svg{width:15px;height:15px}
.onbline .dots i{width:18px;height:5px;border-radius:9px;background:var(--line-2)}
.onbline .dots i.on{background:var(--ok)}
.lnk{all:unset;cursor:pointer;color:var(--primary);font-weight:600;font-size:.88rem}
.lnk:hover{text-decoration:underline}
.lnk:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
.lnk.muted-l{color:var(--muted);font-weight:500}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-t h2{font-size:1.2rem}
.prio{display:flex;flex-direction:column;gap:12px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.pcard .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--crit-soft);color:var(--crit)}
.pcard.warn .ico{background:var(--warn-soft);color:var(--warn)}
.pcard .ico svg{width:20px;height:20px}
.pcard .m{font-size:.78rem;font-weight:700;color:var(--c);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .t{font-weight:700;color:var(--heading);font-size:1rem}
.pcard .s{font-size:.86rem;color:var(--muted);margin-top:2px}
.allgood{display:flex;gap:12px;align-items:center;padding:16px 20px;border-radius:16px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.next{list-style:none;margin:0;padding:0}
.next li button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line)}
.next li:last-child button{border-bottom:0}
.next li button:hover{background:var(--surface-2)}
.next li button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.next .dt{font-weight:700;color:var(--heading);font-variant-numeric:tabular-nums;font-size:.9rem}
.next .late .dt{color:var(--crit)}
.next .x{font-size:.93rem;min-width:0}
.next .x small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .when{font-size:.8rem;color:var(--muted);white-space:nowrap}
.next .when.bad{color:var(--crit);font-weight:700}
.nav .cnt{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--rail-muted);font-variant-numeric:tabular-nums;font-weight:500}
.nav .cnt i{width:7px;height:7px;border-radius:50%;background:var(--crit)}
.plain .sect{padding:22px 0}
.plain .sect:first-child{padding-top:6px}
.linkline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.strip .st{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.strip .stackbar{flex:1 1 240px;height:8px}
.strip .legend{margin-top:0;flex-basis:100%}

/* ---------- Import Excel ---------- */
.istep{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.ihead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ihead h2{flex:1;min-width:200px}
.inum{width:30px;height:30px;border-radius:50%;background:var(--c,var(--primary));color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.dropzone{border:2px dashed var(--line-2);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.dropzone svg{width:30px;height:30px;color:var(--c,var(--primary))}
.dropzone b{color:var(--heading);font-size:1rem}
.dropzone:hover,.dropzone.over{border-color:var(--c,var(--primary));background:var(--cs,var(--primary-soft))}
.dropzone.has{border-style:solid;background:var(--surface-2)}
.maptable{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.88rem}
.mrow:last-child{border-bottom:0}
.mrow.mh{background:var(--surface-2);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.mrow.on{background:color-mix(in srgb,var(--ok-soft) 55%,transparent)}
.mrow .mh1{font-weight:600;color:var(--heading);overflow-wrap:anywhere}
.mrow .mex{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow select{padding:7px 10px}
.iprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ipc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.84rem;border-top:3px solid var(--c,var(--primary))}
.ipc b{color:var(--heading);font-size:.95rem}
.ipc span{display:flex;flex-direction:column}
.ipc i{font-style:normal;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.iopts{display:flex;flex-direction:column;gap:10px}
/* ---------- Modèles, suggestions, recherche ---------- */
.tplbox{background:linear-gradient(120deg,var(--primary-soft),var(--surface));border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.tpl{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line-2);border-radius:99px;padding:8px 14px;font-size:.87rem;font-weight:600;color:var(--heading)}
.tpl:hover{border-color:var(--primary);color:var(--primary)}
.tpl:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sugg{display:flex;flex-wrap:wrap;gap:5px}
.sg{all:unset;cursor:pointer;font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:500}
.sg:hover{background:var(--primary-soft);color:var(--primary)}
.sg:focus-visible{outline:2px solid var(--primary)}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--rail-line);border-radius:11px;padding:0 10px;margin:0 2px;transition:border-color .15s}
.gsearch:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.gsearch svg{width:15px;height:15px;color:var(--rail-muted);flex:none}
.gsearch input{border:0!important;background:transparent!important;box-shadow:none!important;padding:9px 0!important;font-size:.88rem;flex:1;min-width:0}
.gsearch kbd{font-family:var(--f-mono);font-size:.62rem;color:var(--rail-muted);border:1px solid var(--rail-line);border-radius:5px;padding:1px 5px;white-space:nowrap}

.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.letter{display:flex;flex-direction:column;gap:8px}
.letter .lh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.letter textarea{font-size:.85rem;background:var(--surface-2);resize:vertical}
/* ---------- Accueil animé ---------- */
.wov{position:fixed;inset:0;z-index:150;background:var(--bg);overflow-y:auto;overflow-x:hidden;display:flex;justify-content:center;padding:max(36px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(36px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wov .blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:var(--blob-op,.5)}

.cg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.cg-row:last-child{border-bottom:0}
.cg-row:hover{background:var(--surface-2)}
.cg-row input{width:18px;height:18px;accent-color:var(--m-cons)}
.cg-row .nm{font-weight:600;color:var(--heading);min-width:0}
.cg-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.cg-d{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--m-cons-soft);color:var(--m-cons);white-space:nowrap}
.cg-d.none{background:var(--warn-soft);color:var(--warn)}
.cg-src{grid-column:2/-1;color:var(--muted);font-size:.78rem;font-style:italic}
.cg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- À venir ---------- */
.upc{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.upc-top{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px 0}
.upc-f{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink);background:var(--surface);transition:background .15s,border-color .15s}
.upc-f:hover{border-color:var(--c,var(--line-2))}
.upc-f:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.upc-f i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.upc-f .n{color:var(--muted);font-variant-numeric:tabular-nums}
.upc-f[aria-pressed="true"]{background:var(--cs,var(--primary-soft));border-color:var(--c,var(--primary));color:var(--c,var(--heading))}
.upc-f[aria-pressed="true"] .n{color:inherit}
.upc-tl{display:flex;align-items:center;gap:14px;padding:44px 34px 38px 24px}
.upc-lateb{flex:none;font-size:.75rem;font-weight:700;color:var(--crit);background:var(--crit-soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.upc-axis{position:relative;flex:1;height:8px;border-radius:99px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--wk) - 2px),color-mix(in srgb,var(--surface) 70%,transparent) calc(var(--wk) - 2px) var(--wk)),linear-gradient(90deg,color-mix(in srgb,var(--warn) 35%,var(--sunk)) 0%,color-mix(in srgb,var(--primary) 22%,var(--sunk)) 30%,var(--sunk) 100%)}
.upc-today{position:absolute;left:0;bottom:8px;transform:translateX(-50%);font-size:.68rem;font-weight:700;color:var(--heading);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px}
.upc-today i{order:2;width:2px;height:9px;background:var(--heading);border-radius:2px}
.upc-mo{position:absolute;top:14px;transform:translateX(-50%);font-size:.7rem;font-weight:600;color:var(--muted);text-transform:capitalize;white-space:nowrap}
.upc-mo::before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:12px;background:var(--line-2)}
.upc-dot{all:unset;cursor:pointer;position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--c);border:2.5px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18);transform:translate(-50%,-50%);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.upc-dot.multi{width:24px;height:24px;display:grid;place-items:center;font-size:.68rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.upc-dot.multi.sel{box-shadow:0 0 0 4px var(--cs),0 1px 4px rgba(0,0,0,.18)}
.upc-dayf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 22px 0;padding:8px 14px;border-radius:12px;background:var(--primary-soft);font-size:.86rem}
.upc-dot:hover,.upc-dot:focus-visible{transform:translate(-50%,-50%) scale(1.35);z-index:2}
.upc-dot:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.upc-g{padding:2px 14px 6px}
.upc-gh{display:flex;align-items:center;gap:8px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:10px 8px 4px}
.upc-gh .n{background:var(--sunk);border-radius:99px;padding:1px 7px;font-size:.68rem;letter-spacing:0}
.upc-gh::after{content:"";flex:1;height:1px;background:var(--line)}
.upc-g.late .upc-gh{color:var(--crit)}
.upc-g.late .upc-gh .n{background:var(--crit-soft)}
.upc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.upc-it{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 10px;border-radius:14px;transition:background .15s}
.upc-it:hover{background:var(--surface-2)}
.upc-it:hover .dtile{transform:rotate(-4deg) scale(1.04)}
.upc-it:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.dtile{width:50px;height:54px;border-radius:12px;background:var(--cs);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border-top:4px solid var(--c);flex:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.dtile b{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.dtile small{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.upc-it.late .dtile{background:var(--crit-soft);color:var(--crit);border-top-color:var(--crit)}
.upc-x{min-width:0;display:flex;flex-direction:column;gap:2px}
.upc-m{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--c)}
.upc-m svg{width:13px;height:13px;flex:none}
.upc-x b{font-weight:600;color:var(--heading);font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upc-x small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upc-when{font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.upc-when.crit{background:var(--crit-soft);color:var(--crit)}
.upc-when.warn{background:var(--warn-soft);color:var(--warn)}
.upc-when.info{background:var(--primary-soft);color:var(--primary)}
.upc-foot{border-top:1px solid var(--line);padding:10px 20px;display:flex;justify-content:center}
.upc-empty{display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:20px;background:var(--surface);border:1px dashed var(--line-2)}
.upc-empty .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.upc-empty .ico svg{width:22px;height:22px}
.upc-empty b{display:block;color:var(--heading)}
.upc-empty small{color:var(--muted);font-size:.84rem}
@media (prefers-reduced-motion:no-preference){
  .upc-it{animation:upIn .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i) * 45ms)}
  .upc-dot{animation:dotIn .5s cubic-bezier(.3,1.6,.5,1) both}
}
@keyframes upIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dotIn{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
@media (max-width:780px){
  .upc-tl{padding:16px 22px 34px 18px;flex-wrap:wrap;row-gap:40px}
  .upc-lateb{order:-1}
  .upc-axis{flex:1 1 100%}
  .upc-it{grid-template-columns:auto minmax(0,1fr)}
  .upc-when{grid-column:2;justify-self:start;margin-top:-4px}
  .cflow{padding:18px 6px 14px}
  .cdone{grid-template-columns:minmax(0,1fr)}
  .cgen-cta{flex-wrap:wrap}
  .cg-row{grid-template-columns:auto minmax(0,1fr)}
  .cg-d{grid-column:2;justify-self:start}
}

/* ---------- Pièces justificatives ---------- */
.pjpanel .panel-h h2 svg{width:18px;height:18px;color:var(--c,var(--primary))}
.pjlist{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.pjc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:8px 10px 8px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.pjc:hover{border-color:var(--line-2);box-shadow:0 4px 14px rgba(0,56,101,.06)}
.pjlist.wide .pjc{grid-template-columns:minmax(0,1fr) auto auto}
.pjc-main{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0;border-radius:10px;padding:2px}
.pjc-main:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.pjc-x{min-width:0;display:flex;flex-direction:column;gap:1px}
.pjc-x b{color:var(--heading);font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pjc-x small{color:var(--muted);font-size:.78rem}
.pjc-x .pjc-d{color:var(--ink);font-style:italic}
.pjc-main:hover b{color:var(--primary)}
.pjc-a{display:flex;gap:4px;align-items:center}
.pjc-a .btn svg{width:15px;height:15px}
.pjc-a .pjdel:hover{color:var(--crit)}
.pjc-link{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pjc-edit,.pjc-conf{grid-column:1/-1}
.pjc-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:12px;align-items:end;padding:10px 4px 4px;border-top:1px dashed var(--line-2)}
.pjb{--pc:#7A736C;flex:none;position:relative;width:42px;height:50px;border-radius:7px 14px 7px 7px;background:color-mix(in srgb,var(--pc) 12%,var(--surface));border:1.5px solid color-mix(in srgb,var(--pc) 40%,transparent);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:.6rem;font-weight:800;letter-spacing:.04em;color:var(--pc);font-family:var(--f-body)}
.pjb i{position:absolute;top:-1.5px;right:-1.5px;width:13px;height:13px;border-radius:0 12px 0 5px;background:color-mix(in srgb,var(--pc) 35%,var(--surface))}
.pjdrop{position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px;border:2px dashed color-mix(in srgb,var(--c,var(--primary)) 35%,var(--line-2));border-radius:16px;background:color-mix(in srgb,var(--cs,var(--primary-soft)) 45%,var(--surface));cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.pjdrop.big{padding:22px 22px}
.pjdrop:hover,.pjdrop.over{border-color:var(--c,var(--primary));background:var(--cs,var(--primary-soft))}
.pjdrop.over{transform:scale(1.01)}
.pjdrop:focus-within{outline:2px solid var(--c,var(--primary));outline-offset:2px}
.pjdrop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.pjdrop-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--c,var(--primary));box-shadow:0 2px 8px rgba(0,56,101,.08);flex:none}
.pjdrop-ic svg{width:20px;height:20px}
.pjdrop b{display:block;color:var(--heading);font-size:.92rem}
.pjdrop small{color:var(--muted);font-size:.8rem}
.pjdrop.busy{cursor:progress}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c,var(--primary)) 25%,transparent);border-top-color:var(--c,var(--primary));display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pj-ro{font-size:.85rem}
.pjmiss{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:14px;background:var(--warn-soft)}
.pjmiss .ico{color:var(--warn);flex:none;margin-top:2px}
.pjmiss .ico svg{width:20px;height:20px}
.pjmiss b{color:var(--heading);display:block;margin-bottom:8px}
.pjcatsel{width:auto;max-width:260px;padding:5px 30px 5px 12px;border-radius:99px;font-size:.8rem}
/* visionneuse */
.pjv{position:fixed;inset:0;z-index:160;background:#0B1A2E;display:flex;flex-direction:column;color:#fff}
@media (prefers-reduced-motion:no-preference){ .pjv:not([hidden]){animation:pjvIn .22s ease-out} }
@keyframes pjvIn{from{opacity:0}to{opacity:1}}
.pjv-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.pjv-t{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 300px}
.pjv-t .pjb{--pc:#97C7EC;background:rgba(255,255,255,.08)}
.pjv-t b{display:block;font-family:var(--f-display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pjv-t small{color:#B9D3EA;font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pjv-t>div{min-width:0}
.pjv-tools{display:flex;align-items:center;gap:6px}
.pjv-btn{all:unset;cursor:pointer;box-sizing:border-box;height:36px;min-width:36px;padding:0 10px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:rgba(255,255,255,.08);font-weight:600;font-size:1rem;transition:background .15s}
.pjv-btn.wide{font-size:.86rem}
.pjv-btn svg{width:17px;height:17px}
.pjv-btn:hover:not([disabled]){background:rgba(255,255,255,.18)}
.pjv-btn:focus-visible{outline:2px solid #97C7EC;outline-offset:2px}
.pjv-btn[disabled]{opacity:.35;cursor:default}
.pjv-n{font-size:.8rem;color:#B9D3EA;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.pjv-sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 4px}
.pjv-body{flex:1;overflow:auto;padding:24px 16px 40px;outline:none}
.pjv-pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.pjv-page{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);border-radius:3px;max-width:none}
.pjv-load,.pjv-msg{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#DCEBF8}
.pjv-load .spin{--c:#97C7EC;width:28px;height:28px}
.pjv-msg b{font-family:var(--f-display);font-size:1.1rem}
.pjv-msg p{color:#B9D3EA;max-width:46ch}
.pjv-msg .pjb{--pc:#97C7EC;transform:scale(1.4);margin-bottom:10px}
.pjv-img{display:flex;justify-content:center;align-items:flex-start;min-height:100%}
.pjv-img img{max-width:100%;height:auto;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.4);background:#fff}
.pjv-sheet{max-width:880px;margin:0 auto;background:#fff;color:#2b2724;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:56px 64px;font-family:"Public Sans",system-ui,sans-serif;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.pjdoc h1,.pjdoc h2,.pjdoc h3,.pjdoc h4{color:#003865;margin:1.2em 0 .5em;font-family:var(--f-display)}
.pjdoc h1{font-size:1.6rem}.pjdoc h2{font-size:1.3rem}.pjdoc h3{font-size:1.1rem}
.pjdoc p{margin:0 0 .8em}
.pjdoc table{border-collapse:collapse;margin:1em 0;width:100%}
.pjdoc td,.pjdoc th{border:1px solid #d2d5da;padding:6px 8px;vertical-align:top}
.pjdoc img{max-width:100%}
.pjdoc a{color:#0088CE}
.pjv-xl{max-width:100%;width:max-content;padding:0;overflow:auto}
.pjv-xl table{border-collapse:collapse;font-size:13px}
.pjv-xl td{border:1px solid #E1E1E1;padding:5px 9px;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.pjv-xl tr:first-child td{background:#E2F1FA;color:#003865;font-weight:700;position:sticky;top:0}
.pjv-xl tr:nth-child(even) td{background:#F7F9FB}
.pjv-pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;padding:32px 36px}
.pjv-tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 auto 16px}
.pjv-tab{all:unset;cursor:pointer;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.08);font-size:.82rem;font-weight:600}
.pjv-tab[aria-pressed="true"]{background:#fff;color:#003865}
.pjv-note{text-align:center;color:#B9D3EA;font-size:.8rem;margin-top:14px}
@media (max-width:780px){
  .pjc,.pjlist.wide .pjc{grid-template-columns:minmax(0,1fr)}

}

/* ---------- Score de conformité ---------- */
.cscore{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px 26px;padding:16px 20px;border-radius:18px;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--sc) 14%,var(--surface)) 0%,var(--surface) 55%);border:1px solid color-mix(in srgb,var(--sc) 25%,var(--line));box-shadow:0 1px 2px rgba(0,56,101,.05),0 14px 40px color-mix(in srgb,var(--sc) 12%,transparent);overflow:hidden}
.cscore::after{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-90px;border-radius:50%;background:color-mix(in srgb,var(--sc) 9%,transparent);pointer-events:none}
.sc-main{display:flex;align-items:center;gap:16px;min-width:0}
.sc-ring{position:relative;width:104px;height:104px;flex:none}
.sc-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.sc-bg{fill:none;stroke:var(--sunk);stroke-width:13}
.sc-tick{stroke:var(--surface);stroke-width:2.5}
.sc-fg{fill:none;stroke-width:13;stroke-linecap:round;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--sc) 35%,transparent))}
.sc-num{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:34px;gap:1px}
.sc-num b{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1;color:var(--sc);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sc-num span{font-size:.72rem;font-weight:600;color:var(--muted)}
.sc-txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.sc-eyebrow{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sc-txt h2{font-size:1.2rem;font-weight:700;color:var(--heading);display:flex;align-items:center;gap:10px}
.sc-emo{font-size:1.1rem}
.sc-txt p{color:var(--muted);font-size:.84rem;max-width:44ch}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sc-chip{all:unset;box-sizing:border-box;white-space:nowrap;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.sc-chip.up{background:var(--ok-soft);color:var(--ok)}
.sc-chip.down{background:var(--crit-soft);color:var(--crit)}
.sc-chip.gain{cursor:pointer;background:var(--heading);color:var(--surface);transition:transform .15s}
.sc-chip.gain:hover{transform:translateX(3px)}
.sc-chip.gain:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sc-side{display:contents}
.sc-pils{align-self:center;position:relative;z-index:1}
.sc-pils{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.sc-pil small{font-size:.7rem;color:var(--muted)}
.sc-pl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.78rem;font-weight:600;color:var(--heading)}
.sc-pl b{font-family:var(--f-display);font-size:.92rem}
.sc-tr,.sc-dom .mini{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:4px 0 2px}
.sc-tr i,.sc-dom .mini i{display:block;height:100%;width:var(--w);border-radius:99px}
.sc-doms{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 18px;padding-top:8px;border-top:1px solid var(--line)}
.sc-dom{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:22px minmax(0,1fr) 46px 44px;align-items:center;gap:8px;padding:3px 6px;border-radius:8px;font-size:.76rem}
.sc-dom:hover{background:var(--surface-2)}

@media (max-width:1100px){ .cscore{grid-template-columns:minmax(0,1fr)} .sc-pils{grid-template-columns:1fr 1fr} .sc-doms{grid-template-columns:1fr 1fr} }

/* ---------- Formation : catalogue ---------- */
.fstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.fcourse{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}

.fc-top::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 110%,rgba(255,255,255,.25),transparent 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}

.fc-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}

/* illustration animée */
.cart{--r:52px;position:relative;width:150px;height:130px;display:grid;place-items:center;z-index:1}

.cart-ring{position:absolute;inset:0}
.cart-o{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--ang)) translateX(var(--r))}
.cart-o i{position:absolute;left:-14px;top:-14px;width:28px;height:28px;display:grid;place-items:center;font-style:normal;font-size:17px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 3px 8px rgba(0,0,0,.15);transform:rotate(calc(-1 * var(--ang)))}

@media (prefers-reduced-motion:no-preference){
  .cart-ring{animation:cspin 40s linear infinite}

  .cart-glow{animation:cglow 4s ease-in-out infinite}
  .fcourse:hover .cart-ring{animation-duration:12s} .fcourse:hover .cart-o i{animation-duration:12s}
  .fcourse{animation:upIn .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i) * 70ms)}

}
@keyframes cspin{to{rotate:360deg}}

@keyframes cglow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const addDays = (n, from) => { const d = from ? new Date(from+"T12:00:00") : new Date(); d.setDate(d.getDate()+n); return isoLocal(d); };
const addMonths = (iso, n) => { if(!iso) return ""; const d = new Date(iso+"T12:00:00"); const day=d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()<day) d.setDate(0); return isoLocal(d); };

  return a;
};

  const h = Math.round((dl - new Date())/36e5);
  return `<div class="countdown ${h<=24?"crit":"warn"}"><span class="big">${h<0?`+${-h} h`:`${h} h`}</span><p><b>${h<0?"Délai de 72 h dépassé":"Temps restant pour notifier la CNIL"}</b><br>Limite : ${fmtDT(dl.toISOString())}. Prise de connaissance : ${fmtDT(t.dateDecouverte)}.</p></div>`;
};

  {k:"cards", t:"Les données sensibles", lead:"Leur traitement est en principe interdit, sauf exceptions prévues par l'article 9.", c:[["Santé","Arrêts maladie, handicap, aptitude médicale","🩺"],["Origine et opinions","Origine ethnique, opinions politiques, convictions religieuses","🗳️"],["Appartenance syndicale","Adhésion ou mandat syndical","🪧"],["Biométrie et génétique","Empreintes, reconnaissance faciale","🧬"],["Vie sexuelle","Vie ou orientation sexuelle","🔐"],["Très protégées aussi","Numéro de sécurité sociale, infractions, données bancaires","💳"]]},
  {k:"cards", t:"Qui fait quoi ?", c:[["L'entreprise","Responsable du traitement : elle décide pourquoi et comment les données sont utilisées.","🏢"],["Les prestataires","Sous-traitants : ils traitent des données pour notre compte (paie, hébergement…).","🧩"],["Le DPO","Il conseille, contrôle et répond à vos questions.","🧭"],["Vous","Chaque personne qui manipule des données en est responsable au quotidien.","🙋"]]}
 ]},
 {ch:"Les grands principes", slides:[

 ]},
 {ch:"Les droits des personnes", slides:[

 {ch:"Les violations de données", slides:[

 ["Copier un fichier clients sur un service de stockage personnel pour travailler chez soi :",["C'est pratique et sans risque","C'est du « shadow IT » : les données sortent du périmètre maîtrisé par l'entreprise","C'est autorisé si le fichier est petit"],1,"Seuls les outils validés par l'entreprise garantissent sécurité, contrats et traçabilité.",1],

 ["Un ordinateur portable professionnel chiffré est volé. Pour le RGPD :",["C'est une violation de données, à documenter ; la notification peut ne pas être nécessaire si le chiffrement est robuste","Ce n'est pas une violation","Il faut prévenir chaque client immédiatement"],0,"La perte reste une violation (disponibilité), mais le chiffrement réduit fortement le risque et peut dispenser d'informer les personnes (art. 34.3.a).",3],
 ["Le verrouillage de session (Windows + L) doit être fait :",["Seulement le soir","À chaque fois que vous quittez votre poste, même brièvement","Seulement en open space"],1,"Quelques secondes suffisent pour consulter ou envoyer des données depuis un poste ouvert.",1],
 ["Un message Teams d'un « collègue » inconnu vous envoie un lien de document partagé. Vous :",["Cliquez, c'est Teams donc c'est interne","Vérifiez l'expéditeur (externe ?) et le lien avant d'ouvrir","Transférez à toute l'équipe"],1,"Les messageries collaboratives sont aussi utilisées pour l'hameçonnage, notamment via des comptes externes.",2],
 ["Pourquoi éviter le Wi-Fi public sans VPN ?",["Il est lent","Le trafic peut être intercepté ou détourné vers un faux point d'accès","Il consomme la batterie"],1,"Un point d'accès malveillant peut imiter le Wi-Fi de l'hôtel. Préférez le partage de connexion de votre téléphone ou le VPN de l'entreprise.",1],
 ["Selon la CNIL, un mot de passe seul (sans autre mesure) doit compter au minimum :",["8 caractères","12 caractères avec majuscules, minuscules, chiffres et caractères spéciaux","6 chiffres"],1,"La recommandation CNIL de 2022 vise une robustesse d'environ 80 bits : par exemple 12 caractères de 4 types, ou une phrase de passe plus longue.",3],

rh:[
 ["Avant l'embauche, peut-on demander le numéro de sécurité sociale d'un candidat ?",["Oui, dès le premier entretien","Non : il n'est nécessaire qu'au moment de l'embauche","Oui, s'il l'accepte"],1,"Le NIR sert aux déclarations sociales : il n'a pas à être collecté pendant le recrutement (minimisation).",2],

 ["Le candidat doit-il être informé des méthodes de recrutement utilisées (tests, outils) ?",["Non","Oui, préalablement à leur mise en œuvre","Seulement s'il est retenu"],1,"Le Code du travail (art. L1221-8) impose d'informer le candidat des méthodes et techniques d'aide au recrutement.",2],

 ["Un manager peut-il consulter tout le dossier RH de ses collaborateurs ?",["Oui, ce sont ses équipes","Non : uniquement les informations nécessaires à ses missions d'encadrement","Oui, s'il a un mot de passe"],1,"Les habilitations suivent le besoin d'en connaître : le manager n'a pas à voir les données de paie détaillées ou médicales.",1],
 ["Le dossier médical d'un salarié est tenu par :",["Le service RH","La médecine du travail","Le manager direct"],1,"L'employeur ne reçoit que l'avis d'aptitude ou d'inaptitude, jamais le diagnostic.",1],
 ["La géolocalisation d'un véhicule de service peut-elle servir à contrôler en permanence un salarié ?",["Oui, sans limite","Non : elle doit avoir une finalité précise et le salarié doit pouvoir la désactiver hors temps de travail","Oui, si le véhicule appartient à l'entreprise"],1,"La CNIL interdit un suivi permanent et l'utilisation pour contrôler les limitations de vitesse ; les données sont en principe conservées deux mois.",2],
 ["Un logiciel enregistrant toutes les frappes clavier (keylogger) d'un salarié :",["Est un moyen de contrôle normal","Est disproportionné, sauf impératif de sécurité exceptionnel","Est autorisé avec l'accord du CSE"],1,"La CNIL considère ce dispositif comme portant une atteinte excessive à la vie privée des salariés.",2],
 ["En télétravail, peut-on exiger que la webcam reste allumée en permanence ?",["Oui, pour vérifier la présence","Non, c'est disproportionné","Oui, une heure par jour"],1,"La CNIL juge cette surveillance permanente disproportionnée. La caméra peut être demandée pour une réunion, pas en continu.",1],
 ["Le CSE doit-il être consulté avant la mise en place d'un dispositif de contrôle de l'activité des salariés ?",["Non","Oui, préalablement","Seulement au-delà de 300 salariés"],1,"Le Code du travail impose l'information et la consultation du CSE avant tout moyen de contrôle de l'activité des salariés.",2],
 ["Combien de temps conserver les images de vidéoprotection des locaux, en principe ?",["Quelques jours, un mois au maximum sauf incident","Un an","Tant que l'espace disque le permet"],0,"La durée doit être limitée au temps nécessaire pour détecter un incident : quelques jours suffisent souvent, un mois maximum.",1],
 ["Un salarié en arrêt demande l'accès à tous les e-mails internes le concernant. Le droit d'accès :",["Ne couvre pas les e-mails","Couvre les données le concernant dans les e-mails, sous réserve des droits des tiers","Couvre la boîte mail entière de ses collègues"],1,"Le droit d'accès porte sur les données personnelles où qu'elles soient, mais on occulte les informations relatives à d'autres personnes (art. 15.4).",3],
 ["Les dispositifs biométriques (empreinte digitale) de contrôle d'accès au travail :",["Sont libres","Doivent être justifiés par une nécessité de sécurité particulière et respecter le règlement type de la CNIL","Sont interdits"],1,"Le règlement type de 2019 encadre la biométrie au travail : justification, gabarit sous le contrôle de la personne de préférence, AIPD.",3],
 ["Les données de pointage (badgeuse) servant au calcul du temps de travail peuvent être conservées :",["Sans limite","Le temps utile à la gestion du temps de travail et aux obligations légales, puis supprimées","Une semaine"],1,"On distingue les historiques d'accès (quelques mois) et les données de temps de travail utiles à la paie et aux éventuels litiges.",3],
 ["Après le départ d'un salarié, son dossier du personnel est en général conservé :",["1 mois","5 ans, durée de prescription des actions liées au contrat","Toujours"],1,"Les éléments nécessaires à la défense des droits sont gardés pendant les délais de prescription, puis supprimés.",2],
 ["Peut-on exiger un extrait de casier judiciaire de tout candidat ?",["Oui, pour tous les postes","Non : seulement lorsqu'un texte ou la nature du poste le justifie, et sans en conserver de copie","Oui, s'il est majeur"],1,"Les données d'infraction sont très encadrées (art. 10). La vérification se limite aux cas justifiés.",3],
 ["La liste des anniversaires des salariés diffusée sur l'intranet :",["Est interdite","Est possible si les salariés sont informés et peuvent s'y opposer simplement","Est obligatoire"],1,"C'est un usage de convivialité acceptable avec information et droit d'opposition.",1],
 ["Une alerte éthique (lanceur d'alerte) doit garantir :",["La confidentialité de l'identité de l'auteur et des personnes visées","La publication des alertes","Le nom de l'auteur dans le compte rendu"],0,"Les dispositifs d'alerte imposent une stricte confidentialité ; l'identité de l'auteur ne peut être divulguée sans son accord.",2],
 ["Un ancien salarié demande la suppression de ses bulletins de paie détenus par l'entreprise :",["On supprime tout immédiatement","On refuse pour les éléments soumis à une obligation légale de conservation, en l'expliquant","On ne répond pas"],1,"Le droit à l'effacement cède devant une obligation légale de conservation (art. 17.3.b). La réponse doit être motivée.",2],
 ["Les notes d'un entretien annuel doivent être rédigées :",["Librement, même subjectivement","De façon factuelle, objective et en lien avec le travail","Uniquement à l'oral"],1,"Le salarié peut y accéder : chaque mention doit pouvoir être justifiée.",1]

marketing:[

 ["Pour une mesure d'audience exemptée de consentement, la CNIL fixe une durée de vie des traceurs de :",["13 mois maximum","5 ans","Illimitée"],0,"Les traceurs de mesure d'audience exemptés ne doivent pas dépasser 13 mois, les informations collectées étant conservées 25 mois au plus.",3],
 ["Un « cookie wall » (accès au site conditionné à l'acceptation) est-il interdit par principe ?",["Oui, toujours","Non : il est apprécié au cas par cas, notamment selon l'existence d'une alternative réelle","Oui, sauf pour les sites de presse"],1,"Le Conseil d'État (19 juin 2020) a jugé qu'une interdiction générale ne pouvait figurer dans de simples lignes directrices.",3],

 ["Combien de temps conserver les données d'un client à des fins de prospection après la fin de la relation ?",["3 ans","10 ans","Toujours"],0,"La CNIL retient 3 ans à compter de la fin de la relation commerciale ou du dernier contact émanant du client.",2],

/* ---- Tirage sans répétition ---- */
const QLV = {1:"Découverte", 2:"Confirmé", 3:"Expert"};
const qhash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "q" + (h >>> 0).toString(36); };
const QSEEN_K = "egide-quiz-seen", QLEVEL_K = "egide-quiz-level";
const qSeenAll = () => { try { return JSON.parse(localStorage.getItem(QSEEN_K) || "{}"); } catch { return {}; } };
const qSeenSave = o => { try { localStorage.setItem(QSEEN_K, JSON.stringify(o)); } catch {} };
function qLevel(){ try { return localStorage.getItem(QLEVEL_K) || "mixte"; } catch { return "mixte"; } }
function qBank(cid){
  const c = COURSES.find(x => x.id === cid) || COURSES[0];
  const base = (c.quiz || []).map(q => ({...q, lv:q.lv || 1}));
  const extra = (QX[cid] || []).map(([q, o, a, e, lv]) => ({q, o, a, e, lv}));
  const seen = new Set(); return [...base, ...extra].map(q => ({...q, id:qhash(q.q)})).filter(q => !seen.has(q.id) && seen.add(q.id));
}
function qStats(cid){ const b = qBank(cid), s = new Set(qSeenAll()[cid] || []); return {total:b.length, unseen:b.filter(q => !s.has(q.id)).length, byLv:[1,2,3].map(l => b.filter(q => q.lv === l).length)}; }
const QN = 10;
function drawQuiz(cid){
  const lvl = qLevel(), all = qBank(cid);
  let pool = lvl === "mixte" ? all : all.filter(q => q.lv === Number(lvl));
  if (pool.length < QN) pool = all;                                   // banque trop petite pour ce niveau : on élargit
  const seenAll = qSeenAll(); let seen = new Set(seenAll[cid] || []);
  let fresh = pool.filter(q => !seen.has(q.id));
  let pick = qshuffle(fresh).slice(0, QN);
  if (pick.length < QN) {                                              // cycle épuisé : on recommence sans reprendre ce qui vient d'être tiré
    const ids = new Set(pick.map(q => q.id));
    seen = new Set(pick.map(q => q.id));
    pick = pick.concat(qshuffle(pool.filter(q => !ids.has(q.id))).slice(0, QN - pick.length));
    seenAll[cid] = [...seen]; qSeenSave(seenAll);
  }
  if (lvl === "mixte") pick.sort((a, b) => a.lv - b.lv);              // progressif : du plus simple au plus difficile
  return pick.map(q => { const order = qshuffle(q.o.map((_, i) => i)); return {...q, o:order.map(i => q.o[i]), a:order.indexOf(q.a)}; });
}
function markQuizSeen(cid, qs){ const all = qSeenAll(); const s = new Set(all[cid] || []); qs.forEach(q => s.add(q.id)); all[cid] = [...s]; qSeenSave(all); }
function qshuffle(a){ const b=[...a]; for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const QCACHE = {};
function vfDeck(){
  const all = [...GAME_VF, ...GAME_VF_PLUS]; const seenAll = qSeenAll(); let seen = new Set(seenAll.vf || []);
  let fresh = all.filter(x => !seen.has(qhash(x[0])));
  if (fresh.length < 12) { seen = new Set(); seenAll.vf = []; qSeenSave(seenAll); fresh = all; }
  return qshuffle(fresh);
}
function markVfSeen(it){ const all = qSeenAll(); const s = new Set(all.vf || []); s.add(qhash(it[0])); all.vf = [...s]; qSeenSave(all); }

function trainBase(){

function trainLink(cfg){
  const q = new URLSearchParams();
  if (cfg.cours?.length && cfg.cours.length < COURSES.length) q.set("c", cfg.cours.join(","));
  if (S.org.raisonSociale) q.set("org", S.org.raisonSociale);
  if (cfg.dpo) q.set("dpo", cfg.dpo);
  if (cfg.up) q.set("up", cfg.up);
  const dirs = orgDirs(S.org); if (dirs.length) q.set("dir", dirs.join("|"));
  return trainBase().replace(/#.*$/, "") + "#formation&" + q.toString();

function parseResults(text){
  const out = []; const push = o => { if (o && o.type === "egide-formation" && o.email && o.cours) out.push(o); };
  for (const m of String(text).matchAll(/EGIDE1\.([A-Za-z0-9_-]{20,})/g)) { try { push(JSON.parse(unb64u(m[1]))); } catch {} }
  try { const j = JSON.parse(text); [].concat(j).forEach(push); } catch {}
  return out;
}
